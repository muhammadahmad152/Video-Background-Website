
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Background Website</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <video autoplay muted loop playsinline>
        <source src="background-video.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <main class="hero">

        <div class="hero-card">

            <div class="icon">
                <i class="fa-solid fa-code"></i>
            </div>

            <p class="subtitle">
                WELCOME TO MY WEBSITE
            </p>

            <h1>
                Muhammad Ahmad
            </h1>

            <p class="description">
                Frontend Developer • JavaScript Developer • Backend Developer • PHP & Laravel Developer • Wordpress Developer • Future Software Engineer
            </p>

            <button class="btn btn-light custom-btn">
                <i class="fa-solid fa-arrow-right"></i>
                Explore
            </button>

            <button class="btn btn-outline-light play-pause-btn">
                <i class="fa-solid fa-pause"></i>
                Pause Video
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
